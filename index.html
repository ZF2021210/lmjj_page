<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#4A90E2">
  <title>穆祉丞 × 王橹杰</title>
  <style>
/* LMJJ 网页版 —— 蓝粉应援色主题（对齐 Android AppColors） */
:root {
  --support-blue: #4A90E2;
  --idol-pink: #FF9EBB;
  --pink-deep: #FF6B9D;
  --pink-light: #FFE4EC;
  --blue-light: #B3D4F2;
  --cream: #FFF8F5;
  --on-ink: #2C2C3A;
  --on-ink-variant: #8A8A99;
  --grad: linear-gradient(135deg, var(--support-blue), var(--idol-pink));
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-top: env(safe-area-inset-top, 0px);
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  height: 100%;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  color: var(--on-ink);
  background: #f0f0f5;
  overscroll-behavior: none;
}
body { display: flex; justify-content: center; }
.hidden { display: none !important; }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input { font-family: inherit; }
#app {
  width: 100%; max-width: 480px;
  min-height: 100vh; min-height: 100dvh;
  background: linear-gradient(180deg, var(--cream) 0%, #EEF4FF 100%);
  display: flex; flex-direction: column;
  position: relative; overflow-x: hidden;
}
.page {
  flex: 1;
  padding-bottom: calc(72px + var(--safe-bottom));
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
.topbar {
  font-size: 22px; font-weight: 700;
  padding: calc(12px + var(--safe-top)) 16px 8px;
  background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
}
/* 相册 */
.album-cp-card {
  margin: 8px 16px 12px; padding: 18px;
  border-radius: 20px; background: var(--grad); color: #fff;
  box-shadow: 0 6px 18px rgba(255,158,187,0.35);
}
.cp-names { font-size: 22px; font-weight: 700; }
.cp-days { margin-top: 4px; font-size: 13px; opacity: 0.95; }
.chips { display: flex; gap: 8px; padding: 0 16px 10px; overflow-x: auto; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex-shrink: 0; padding: 6px 14px; border-radius: 16px;
  background: #fff; color: var(--on-ink-variant); font-size: 14px;
  border: 1px solid var(--blue-light); transition: all .15s;
}
.chip.active { background: var(--grad); color: #fff; border-color: transparent; font-weight: 600; }
.chip-import { color: var(--support-blue); font-weight: 600; }
.photo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 0 16px; }
.photo-cell {
  position: relative; border-radius: 16px; overflow: hidden;
  aspect-ratio: 3/4; background: #eee; cursor: pointer;
  box-shadow: 0 4px 12px rgba(74,144,226,0.12);
}
.photo-cell img { width: 100%; height: 100%; object-fit: cover; display: block; }
.fav-badge { position: absolute; top: 6px; right: 6px; color: #fff; font-size: 16px; text-shadow: 0 1px 3px rgba(0,0,0,.4); }
.empty-hint { grid-column: 1/-1; text-align: center; color: var(--on-ink-variant); padding: 60px 20px; font-size: 14px; }
/* 走马灯 */
#page-slideshow { background: #000; padding: 0; display: flex; flex-direction: column; }
.slideshow-stage { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; }
.slideshow-stage img { max-width: 100%; max-height: 100%; object-fit: contain; }
.petals-canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }
.music-bar {
  position: fixed; left: 50%; right: auto; transform: translateX(-50%);
  width: calc(100vw - 24px); max-width: 456px;
  bottom: calc(76px + var(--safe-bottom));
  z-index: 40; border-radius: 22px; padding: 14px 16px 12px;
  background: rgba(30,30,45,0.55);
  -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
  border: 1px solid rgba(255,255,255,0.22);
  box-shadow: 0 10px 34px rgba(0,0,0,0.5);
  transition: transform .3s ease, opacity .3s ease;
}
.music-bar.music-collapsed { transform: translateX(-50%) translateY(140%); opacity: 0; pointer-events: none; }
.music-bar::before { content: ''; position: absolute; top: 0; left: 24px; right: 24px; height: 3px; border-radius: 3px; background: var(--grad); }
.music-title { color: #fff; font-size: 13px; text-align: center; margin-bottom: 6px; text-shadow: 0 1px 3px rgba(0,0,0,.4); }
.music-seek { width: 100%; accent-color: var(--idol-pink); height: 4px; }
.music-controls { display: flex; justify-content: center; align-items: center; gap: 18px; margin-top: 10px; }
.mc-btn { color: #fff; font-size: 19px; width: 42px; height: 42px; border-radius: 50%; background: rgba(255,255,255,0.16); border: 0; display: flex; align-items: center; justify-content: center; -webkit-tap-highlight-color: transparent; cursor: pointer; }
.mc-btn:active { background: rgba(255,255,255,0.32); }
.play-btn { font-size: 22px; width: 54px; height: 54px; background: var(--grad); box-shadow: 0 4px 14px rgba(255,107,157,0.5); }
.play-btn:active { background: var(--pink-deep); }
/* 我的 */
.manage-list { padding: 4px 16px 0; }
.manage-entry {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 16px; background: #fff; border: 1px solid var(--blue-light);
  border-radius: 16px; margin-bottom: 10px; font-size: 16px;
}
.manage-entry .chev { margin-left: auto; color: var(--on-ink-variant); }
.manage-entry:active { background: var(--pink-light); }
.settings-card { margin: 16px; padding: 12px 16px; background: #fff; border: 1px solid var(--blue-light); border-radius: 16px; }
.settings-title { font-weight: 700; margin-bottom: 8px; }
.switch-row, .slider-row, .date-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 0; font-size: 15px; border-top: 1px solid #f0f0f5;
}
.switch-row input { width: 20px; height: 20px; accent-color: var(--support-blue); }
.slider-row input { width: 50%; accent-color: var(--support-blue); }
.date-row input { font-size: 14px; color: var(--on-ink-variant); }
#manage-detail { padding: 0 16px; }
.detail-back { color: var(--support-blue); font-size: 14px; margin-bottom: 8px; font-weight: 600; }
.detail-title { font-size: 18px; font-weight: 700; margin-bottom: 12px; }
.add-btn { display: inline-block; padding: 6px 14px; border-radius: 14px; background: var(--grad); color: #fff; font-size: 14px; font-weight: 600; margin-bottom: 12px; }
.mg-item { display: flex; align-items: center; gap: 10px; background: #fff; border: 1px solid var(--blue-light); border-radius: 12px; padding: 8px; margin-bottom: 8px; }
.mg-item img { width: 52px; height: 52px; border-radius: 8px; object-fit: cover; }
.mg-item .mg-name { flex: 1; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mg-item .mg-sub { font-size: 12px; color: var(--on-ink-variant); }
.mg-item .mg-del { color: var(--pink-deep); font-size: 20px; padding: 4px; }
.cd-card { display: flex; align-items: center; gap: 12px; background: #fff; border: 1px solid var(--blue-light); border-radius: 16px; padding: 14px; margin-bottom: 10px; }
.cd-info { flex: 1; }
.cd-info .cd-t { font-size: 16px; font-weight: 700; }
.cd-info .cd-d { font-size: 12px; color: var(--on-ink-variant); }
.cd-remain { font-weight: 700; color: var(--support-blue); font-size: 14px; }
.cd-del { color: var(--pink-deep); font-size: 18px; padding: 4px; }
.manage-entry, .cd-card, .settings-card, .mg-item, .dialog-card { box-shadow: 0 2px 10px rgba(74,144,226,0.08); }
/* 底栏 */
.tabbar {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 480px; background: var(--grad);
  padding: 6px 0 var(--safe-bottom); display: flex; z-index: 50;
  box-shadow: 0 -2px 12px rgba(0,0,0,0.1);
}
.tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; color: rgba(255,255,255,0.7); padding: 4px 0; transition: all .15s; }
.tab.active { color: #fff; }
.tab-icon { font-size: 22px; }
.tab.active .tab-icon { font-size: 24px; }
.tab-label { font-size: 11px; }
/* Lightbox */
.lightbox { position: fixed; inset: 0; z-index: 100; background: #000; display: flex; flex-direction: column; }
.lightbox-close { position: absolute; top: calc(8px + var(--safe-top)); left: 12px; color: #fff; font-size: 24px; z-index: 2; padding: 4px 8px; }
.lightbox-stage { flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.lightbox-stage img { max-width: 100%; max-height: 100%; object-fit: contain; }
.lightbox-actions { display: flex; justify-content: space-around; padding: 12px 16px calc(12px + var(--safe-bottom)); background: rgba(0,0,0,0.5); }
.lightbox-actions button { color: #fff; font-size: 22px; padding: 6px 10px; }
/* 弹窗 */
.dialog { position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; padding: 20px; }
.dialog-card { width: 100%; max-width: 360px; background: #fff; border-radius: 20px; padding: 20px; }
.dialog-card h3 { margin-bottom: 14px; font-size: 18px; }
.cd-input { width: 100%; padding: 10px 12px; border: 1px solid var(--blue-light); border-radius: 10px; font-size: 15px; margin-bottom: 12px; }
.cd-field { display: block; font-size: 13px; color: var(--on-ink-variant); }
.emoji-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
.emoji-pick { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; border: 1px solid transparent; }
.emoji-pick.sel { background: var(--pink-light); border-color: var(--idol-pink); }
.dialog-actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 8px; }
.btn-text { color: var(--on-ink-variant); padding: 8px 16px; }
.btn-primary { background: var(--grad); color: #fff; padding: 8px 20px; border-radius: 12px; font-weight: 600; }
/* 通知横幅 */
.notify-banner {
  position: fixed; top: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 480px; background: var(--grad); color: #fff;
  padding: calc(12px + var(--safe-top)) 16px 12px; z-index: 300;
  box-shadow: 0 4px 16px rgba(0,0,0,0.2); display: flex; align-items: center; gap: 12px;
}
.notify-banner .nb-close { margin-left: auto; font-size: 18px; opacity: 0.9; }
  </style>
</head>
<body>
<div id="app">
  <section id="page-album" class="page">
    <div class="topbar">相册</div>
    <div class="album-cp-card">
      <div class="cp-names">穆祉丞 × 王橹杰</div>
      <div class="cp-days" id="cp-days">记录每一个心动瞬间 ❤</div>
    </div>
    <div class="chips" id="chips">
      <button class="chip active" data-filter="all">全部</button>
      <button class="chip" data-filter="MU">穆</button>
      <button class="chip" data-filter="WANG">橹</button>
      <button class="chip" data-filter="CP">LM</button>
      <button class="chip chip-import" id="btn-import-photo">＋ 导入</button>

  <section id="page-slideshow" class="page hidden">

        <button id="btn-prev" class="mc-btn" title="上一首">⏮</button>
        <button id="btn-play" class="mc-btn play-btn" title="播放/暂停">▶</button>
        <button id="btn-next" class="mc-btn" title="下一首">⏭</button>
      </div>
    </div>
  </section>

  <section id="page-manage" class="page hidden">
    <div class="topbar">我的</div>
    <div class="manage-list">
      <div class="manage-entry" data-target="photo"><span>📷</span><span>照片管理</span><span class="chev">›</span></div>
      <div class="manage-entry" data-target="music"><span>🎵</span><span>音乐管理</span><span class="chev">›</span></div>
      <div class="manage-entry" data-target="countdown"><span>⏰</span><span>倒计时</span><span class="chev">›</span></div>

    <div class="settings-card">
      <div class="settings-title">设置</div>
      <label class="switch-row"><span>花瓣特效</span><input type="checkbox" id="set-petals" checked></label>
      <div class="slider-row">
        <span>走马灯间隔 <b id="interval-val">4</b> 秒</span>
        <input type="range" id="set-interval" min="1" max="10" value="4">
      </div>
      <div class="date-row"><span>CP 纪念日</span><input type="date" id="set-anniversary"></div>
    </div>
    <div id="manage-detail"></div>
  </section>

  <nav class="tabbar">
    <button class="tab active" data-page="album"><span class="tab-icon">🖼️</span><span class="tab-label">相册</span></button>
    <button class="tab" data-page="slideshow"><span class="tab-icon">✨</span><span class="tab-label">走马灯</span></button>
    <button class="tab" data-page="manage"><span class="tab-icon">🔖</span><span class="tab-label">我的</span></button>
  </nav>
</div>

<div id="lightbox" class="lightbox hidden">
  <div class="lightbox-close" id="lightbox-close">✕</div>
  <div class="lightbox-stage" id="lightbox-stage"></div>
  <div class="lightbox-actions">
    <button id="lb-favorite" title="收藏">♡</button>
    <button id="lb-category" title="归类">🏷️</button>
    <button id="lb-share" title="分享">↗</button>
    <button id="lb-delete" title="删除">🗑️</button>
    <button id="lb-slideshow" title="走马灯">▶︎</button>
  </div>
</div>

<div id="cd-dialog" class="dialog hidden">
  <div class="dialog-card">
    <h3 id="cd-dialog-title">新建倒计时</h3>
    <input type="text" id="cd-title" class="cd-input" placeholder="事件名称">
    <label class="cd-field">日期时间
      <input type="datetime-local" id="cd-datetime" class="cd-input">
    </label>
    <div class="emoji-row" id="emoji-row"></div>
    <div class="dialog-actions">
      <button id="cd-cancel" class="btn-text">取消</button>
      <button id="cd-save" class="btn-primary">保存</button>
    </div>
  </div>
</div>

<div id="notify-banner" class="notify-banner hidden"></div>

<input type="file" id="file-photo" accept="image/*" multiple class="hidden">
<input type="file" id="file-music" accept="audio/*" multiple class="hidden">

<noscript><div style="padding:40px 20px;text-align:center;color:#8A8A99;">本页需要 JavaScript，请用 Safari / Chrome 浏览器打开本文件。</div></noscript>

<script>
(function () {
'use strict';

// ===== 打包资源（img/ 与 music/ 随包发布；相对路径直引，file:// 双击也能加载）=====
// 文件名用纯 ASCII（去中文/空格），避免手机浏览器 file:// 下编码加载失败
var BUNDLED_PHOTOS = [
  {f:'wang_1.jpg',c:'WANG'},{f:'wang_2.jpg',c:'WANG'},{f:'wang_3.jpg',c:'WANG'},{f:'wang_4.jpg',c:'WANG'},{f:'wang_5.jpg',c:'WANG'},{f:'wang_6.jpg',c:'WANG'},{f:'wang_7.jpg',c:'WANG'},
  {f:'mu_1.jpg',c:'MU'},{f:'mu_2.jpg',c:'MU'},{f:'mu_3.jpg',c:'MU'},{f:'mu_4.jpg',c:'MU'},{f:'mu_5.jpg',c:'MU'},{f:'mu_6.jpg',c:'MU'},{f:'mu_7.jpg',c:'MU'},
  {f:'cp_1.jpg',c:'CP'},{f:'cp_2.jpg',c:'CP'},{f:'cp_3.jpg',c:'CP'},{f:'cp_4.jpg',c:'CP'},{f:'cp_5.jpg',c:'CP'},{f:'cp_6.jpg',c:'CP'},{f:'cp_7.jpg',c:'CP'},{f:'cp_8.jpg',c:'CP'},{f:'cp_9.jpg',c:'CP'},{f:'cp_10.jpg',c:'CP'}
];
var BUNDLED_TRACKS = [
  {f:'track_wang_1.mp3',t:'王橹杰 - 下雨天'},{f:'track_wang_2.mp3',t:'王橹杰 - 美杜莎'},{f:'track_wang_3.mp3',t:'王橹杰 - 黄昏晓'},{f:'track_wang_4.mp3',t:'王橹杰 - 野心家'},
  {f:'track_mu_1.mp3',t:'穆祉丞 - 偷偷做个梦'},{f:'track_mu_2.mp3',t:'穆祉丞 - 等待一切重来'},{f:'track_mu_3.mp3',t:'穆祉丞 - 慢冷'},{f:'track_mu_4.mp3',t:'穆祉丞 - Love Yourself'}
];

// ===== 数据层：IndexedDB 仅存「用户导入」的照片/音乐 blob；打包资源不入库 =====
var DB_NAME = 'lmjj_db', DB_VER = 1, db = null;

function openDB() {
  return new Promise(function (resolve, reject) {
    var req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = function (e) {
      var d = e.target.result;
      if (!d.objectStoreNames.contains('photos')) d.createObjectStore('photos', { keyPath: 'id' });
      if (!d.objectStoreNames.contains('tracks')) d.createObjectStore('tracks', { keyPath: 'id' });
    };
    req.onsuccess = function () { db = req.result; resolve(db); };
    req.onerror = function () { reject(req.error); };
  });
}
function idbPut(store, obj) {
  return new Promise(function (res, rej) {
    var r = db.transaction(store, 'readwrite').objectStore(store).put(obj);
    r.onsuccess = function () { res(); }; r.onerror = function () { rej(r.error); };
  });
}
function idbAll(store) {
  return new Promise(function (res, rej) {
    var r = db.transaction(store).objectStore(store).getAll();
    r.onsuccess = function () { res(r.result); }; r.onerror = function () { rej(r.error); };
  });
}
function idbDel(store, id) {
  return new Promise(function (res, rej) {
    var r = db.transaction(store, 'readwrite').objectStore(store).delete(id);
    r.onsuccess = function () { res(); }; r.onerror = function () { rej(r.error); };
  });
}

var LS_SETTINGS = 'lmjj_settings', LS_CD = 'lmjj_countdowns';
function defaultSettings() { return { petalsEnabled: true, slideshowIntervalSec: 4, anniversaryMs: 0 }; }
function loadSettings() { try { return JSON.parse(localStorage.getItem(LS_SETTINGS)) || defaultSettings(); } catch (e) { return defaultSettings(); } }
function saveSettings(s) { try { localStorage.setItem(LS_SETTINGS, JSON.stringify(s)); } catch (e) {} }
function loadCountdowns() { try { return JSON.parse(localStorage.getItem(LS_CD)) || []; } catch (e) { return []; } }
function saveCountdowns(list) { try { localStorage.setItem(LS_CD, JSON.stringify(list)); } catch (e) {} }

// ===== 工具（对齐 services.dart UriUtil）=====
function categorizeByName(name) {
  var hasWang = /王橹杰|WLJ|橹/i.test(name);
  var hasMu = /穆祉丞|MZC|穆/i.test(name);
  if (hasWang && hasMu) return 'CP';
  if (hasWang) return 'WANG';
  if (hasMu) return 'MU';
  return 'CP';
}
function baseName(path) { return String(path).split(/[\\/]/).pop().replace(/\.[^.]+$/, ''); }
function uid(p) { return p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function pad(n) { return String(n).padStart(2, '0'); }
function fmtDate(ms) { var d = new Date(ms); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function fmtDateTime(ms) { var d = new Date(ms); return fmtDate(ms) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function forStore(o) { var c = {}; for (var k in o) if (k !== 'url' && k !== 'bundled') c[k] = o[k]; return c; }

// ===== 状态 =====
var state = {
  photos: [], tracks: [], settings: defaultSettings(), countdowns: [],
  filter: 'all', page: 'album',
  slideshow: { idx: 0, timer: null },
  lightbox: { idx: 0 },
  music: { audio: null, idx: 0, playing: false, updating: false },
  cdEditing: null
};

// ===== 加载：打包资源（相对路径）+ IndexedDB 导入项（best-effort）=====
async function loadAll() {
  state.photos = BUNDLED_PHOTOS.map(function (p) {
    var num = (p.f.match(/(\d+)/) || [])[1] || '';
    var cap = ({ WANG: '王橹杰', MU: '穆祉丞', CP: 'LM' }[p.c] || '') + (num ? ' ' + num : '');
    return { id: 'bundled_p_' + p.f, url: 'img/' + p.f, category: p.c, favorite: false, caption: cap, bundled: true };
  });
  state.tracks = BUNDLED_TRACKS.map(function (p) {
    return { id: 'bundled_t_' + p.f, url: 'music/' + p.f, title: p.t, bundled: true };
  });
  try {
    await openDB();
    (await idbAll('photos')).forEach(function (p) { p.url = URL.createObjectURL(p.blob); p.bundled = false; state.photos.push(p); });
    (await idbAll('tracks')).forEach(function (t) { t.url = URL.createObjectURL(t.blob); t.bundled = false; state.tracks.push(t); });
  } catch (e) { console.warn('IndexedDB 不可用，仅显示打包内容', e); }
  state.settings = loadSettings(); state.countdowns = loadCountdowns();
}

// ===== DOM 简写 =====
function $(id) { return document.getElementById(id); }
function el(tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }

// ===== 页面路由 =====
function switchPage(name) {
  state.page = name;
  ['album', 'slideshow', 'manage'].forEach(function (p) { $('page-' + p).classList.toggle('hidden', p !== name); });
  document.querySelectorAll('.tab').forEach(function (t) { t.classList.toggle('active', t.dataset.page === name); });
  if (name === 'album') renderAlbum();
  if (name === 'slideshow') startSlideshow(); else stopSlideshow();
  if (name === 'manage') renderManageHome();
}

// ===== 相册 =====
function filteredPhotos() { return state.filter === 'all' ? state.photos : state.photos.filter(function (p) { return p.category === state.filter; }); }
function renderAlbum() {
  var cp = $('cp-days');
  if (state.settings.anniversaryMs > 0) {
    var days = Math.floor((Date.now() - state.settings.anniversaryMs) / 86400000);
    cp.textContent = days >= 0 ? ('在一起第 ' + (days + 1) + ' 天 ❤') : ('距纪念日前 ' + (-days) + ' 天');
  } else cp.textContent = '记录每一个心动瞬间 ❤';
  var list = filteredPhotos(), grid = $('photo-grid'); grid.innerHTML = '';
  if (list.length === 0) { grid.appendChild(el('div', 'empty-hint', '暂无照片')); return; }
  list.forEach(function (p) {
    var cell = el('div', 'photo-cell'), img = el('img'); img.src = p.url; img.alt = p.caption || '';
    cell.appendChild(img);
    if (p.favorite) cell.appendChild(el('div', 'fav-badge', '❤'));
    cell.addEventListener('click', function () { openLightbox(p.id); });
    grid.appendChild(cell);
  });
}

// ===== Lightbox =====
function openLightbox(id) {
  var list = filteredPhotos(), idx = list.findIndex(function (p) { return p.id === id; });
  if (idx < 0) return;
  state.lightbox.idx = idx;
  $('lightbox').classList.remove('hidden'); renderLightbox();
}
function renderLightbox() {
  var p = filteredPhotos()[state.lightbox.idx]; if (!p) return;
  var stage = $('lightbox-stage'); stage.innerHTML = '';
  var img = el('img'); img.src = p.url; stage.appendChild(img);
  $('lb-favorite').textContent = p.favorite ? '❤' : '♡';
}
function closeLightbox() { $('lightbox').classList.add('hidden'); }
function lbNext(d) { var l = filteredPhotos(); state.lightbox.idx = (state.lightbox.idx + d + l.length) % l.length; renderLightbox(); }
async function lbToggleFavorite() {
  var p = filteredPhotos()[state.lightbox.idx]; if (!p) return;
  p.favorite = !p.favorite;
  if (!p.bundled) { try { await idbPut('photos', forStore(p)); } catch (e) {} }
  renderLightbox(); renderAlbum();
}
async function lbCycleCategory() {
  var p = filteredPhotos()[state.lightbox.idx]; if (!p) return;
  var o = ['CP', 'MU', 'WANG']; p.category = o[(o.indexOf(p.category) + 1) % o.length];
  if (!p.bundled) { try { await idbPut('photos', forStore(p)); } catch (e) {} }
  renderLightbox(); renderAlbum();
}
async function lbShare() {
  var p = filteredPhotos()[state.lightbox.idx]; if (!p) return;
  if (!navigator.share) { banner('当前浏览器不支持系统分享，可长按图片保存'); return; }
  try {
    var blob;
    if (p.bundled) { var resp = await fetch(p.url); blob = await resp.blob(); }
    else blob = p.blob;
    var f = new File([blob], (p.caption || 'photo') + '.jpg', { type: blob.type || 'image/jpeg' });
    await navigator.share({ files: [f], title: p.caption || 'LMJJ' });
  } catch (e) { if (e.name !== 'AbortError') banner('分享失败：' + e.message); }
}
async function lbDelete() {
  var p = filteredPhotos()[state.lightbox.idx]; if (!p) return;
  if (p.bundled) { banner('打包照片不可删除'); return; }
  if (!confirm('删除这张照片？')) return;
  try { await idbDel('photos', p.id); } catch (e) {}
  state.photos = state.photos.filter(function (x) { return x.id !== p.id; });
  closeLightbox(); renderAlbum();
}
function lbToSlideshow() {
  var p = filteredPhotos()[state.lightbox.idx]; closeLightbox();
  var i = state.photos.findIndex(function (x) { return x.id === p.id; });
  if (i >= 0) state.slideshow.idx = i;
  switchPage('slideshow');
}

// ===== 走马灯 =====
function startSlideshow() { renderSlideshow(); ensureTimer(); startPetals(); musicPlay(); $('music-bar').classList.remove('music-collapsed'); }
function stopSlideshow() { if (state.slideshow.timer) { clearInterval(state.slideshow.timer); state.slideshow.timer = null; } stopPetals(); musicPause(); }
function ensureTimer() {
  var sec = state.settings.slideshowIntervalSec;
  if (state.slideshow.timer) clearInterval(state.slideshow.timer);
  state.slideshow.timer = setInterval(function () {
    if (state.photos.length === 0) return;
    state.slideshow.idx = (state.slideshow.idx + 1) % state.photos.length; renderSlideshow();
  }, sec * 1000);
}
function renderSlideshow() {
  var stage = $('slideshow-stage'); stage.innerHTML = '';
  if (state.photos.length === 0) { stage.appendChild(el('div', 'empty-hint', '暂无照片')); return; }
  if (state.slideshow.idx >= state.photos.length) state.slideshow.idx = 0;
  var img = el('img'); img.src = state.photos[state.slideshow.idx].url; stage.appendChild(img);
}

// ===== 花瓣（6 形状：心/樱花/水滴/星/菱形/圆环）=====
var petalsRAF = null, petalsParticles = [];
function startPetals() {
  if (!state.settings.petalsEnabled) { stopPetals(); return; }
  var canvas = $('petals'), ctx = canvas.getContext('2d');
  function resize() { canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight; }
  resize(); petalsParticles = [];
  var colors = ['#FF9EBB', '#FF6B9D', '#4A90E2', '#B3D4F2', '#FFE4EC'];
  for (var i = 0; i < 18; i++) {
    petalsParticles.push({
      x: Math.random() * canvas.width, y: Math.random() * canvas.height, r: 6 + Math.random() * 8,
      vy: 0.4 + Math.random() * 1.2, vx: -0.5 + Math.random(), rot: Math.random() * 6.28, vrot: -0.02 + Math.random() * 0.04,
      shape: Math.floor(Math.random() * 6), color: colors[Math.floor(Math.random() * colors.length)], alpha: 0.6 + Math.random() * 0.4
    });
  }
  function frame() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    petalsParticles.forEach(function (pt) {
      pt.y += pt.vy; pt.x += pt.vx; pt.rot += pt.vrot;
      if (pt.y > canvas.height + 20) { pt.y = -20; pt.x = Math.random() * canvas.width; }
      if (pt.x < -20) pt.x = canvas.width + 20; if (pt.x > canvas.width + 20) pt.x = -20;
      drawPetal(ctx, pt);
    });
    petalsRAF = requestAnimationFrame(frame);
  }
  window.addEventListener('resize', resize); frame();
}
function stopPetals() { if (petalsRAF) { cancelAnimationFrame(petalsRAF); petalsRAF = null; } }
function drawPetal(ctx, pt) {
  ctx.save(); ctx.translate(pt.x, pt.y); ctx.rotate(pt.rot);
  ctx.globalAlpha = pt.alpha; ctx.fillStyle = pt.color;
  var r = pt.r;
  switch (pt.shape) {
    case 0:
      var s = r / 14; ctx.beginPath(); ctx.moveTo(0, 4 * s);
      ctx.bezierCurveTo(-14 * s, -6 * s, -14 * s, -18 * s, 0, -8 * s);
      ctx.bezierCurveTo(14 * s, -18 * s, 14 * s, -6 * s, 0, 4 * s); ctx.fill(); break;
    case 1:
      for (var i = 0; i < 5; i++) { ctx.beginPath(); ctx.ellipse(0, -r * 0.6, r * 0.35, r * 0.7, (i * 6.283) / 5, 0, 6.283); ctx.fill(); } break;
    case 2:
      ctx.beginPath(); ctx.moveTo(0, -r);
      ctx.bezierCurveTo(r * 0.7, -r * 0.3, r * 0.7, r, 0, r);
      ctx.bezierCurveTo(-r * 0.7, r, -r * 0.7, -r * 0.3, 0, -r); ctx.fill(); break;
    case 3:
      ctx.beginPath();
      for (var j = 0; j < 5; j++) { var a = (j * 6.283) / 5 - 1.57; ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); a += 0.628; ctx.lineTo(Math.cos(a) * r * 0.45, Math.sin(a) * r * 0.45); }
      ctx.closePath(); ctx.fill(); break;
    case 4:
      ctx.beginPath(); ctx.moveTo(0, -r); ctx.lineTo(r * 0.6, 0); ctx.lineTo(0, r); ctx.lineTo(-r * 0.6, 0); ctx.closePath(); ctx.fill(); break;
    case 5:
      ctx.beginPath(); ctx.arc(0, 0, r, 0, 6.283); ctx.lineWidth = r * 0.35; ctx.strokeStyle = pt.color; ctx.stroke(); break;
  }
  ctx.restore();
}

// ===== 音乐播放器（列表循环 + 停止）=====
function musicInit() {
  var a = new Audio(); a.loop = false;
  var failed = new Set(); // 已加载失败的曲目下标，防止全部失败时无限跳曲
  a.addEventListener('ended', function () { failed.clear(); musicNext(); });
  a.addEventListener('timeupdate', function () { if (state.music.updating) return; if (a.duration && isFinite(a.duration)) $('music-seek').value = (a.currentTime / a.duration) * 1000; });
  a.addEventListener('error', function () {
    console.warn('曲目加载失败', a.src);
    failed.add(state.music.idx);
    if (failed.size >= state.tracks.length) {
      // 所有曲目均加载失败：停止，避免无限跳曲死循环
      state.music.playing = false; updatePlayBtn();
      $('music-title').textContent = '曲目无法播放（浏览器限制本地文件，建议用 GitHub Pages）';
      return;
    }
    musicNext();
  });
  state.music.audio = a;
}
function musicCurrent() { return state.tracks[state.music.idx]; }
function musicLoad() {
  var t = musicCurrent();
  if (!t) { $('music-title').textContent = '暂无曲目'; state.music.audio.pause(); updatePlayBtn(); return; }
  $('music-title').textContent = t.title || '曲目';
  state.music.audio.src = t.url; state.music.audio.load();
}
function musicPlay() {
  if (state.tracks.length === 0) return;
  if (!musicCurrent()) state.music.idx = 0;
  if (!state.music.audio.src) musicLoad();
  var pr = state.music.audio.play(); if (pr && pr.catch) pr.catch(function () { /* 自动播放被拦，忽略 */ });
  state.music.playing = true; updatePlayBtn();
}
function musicPause() { state.music.audio.pause(); state.music.playing = false; updatePlayBtn(); }
function musicStop() { state.music.audio.pause(); try { state.music.audio.currentTime = 0; } catch (e) {} state.music.playing = false; $('music-seek').value = 0; updatePlayBtn(); }
function musicToggle() { if (state.music.playing) musicPause(); else musicPlay(); }
function musicNext() { if (state.tracks.length === 0) return; state.music.idx = (state.music.idx + 1) % state.tracks.length; musicLoad(); if (state.music.playing) musicPlay(); }
function musicPrev() { if (state.tracks.length === 0) return; state.music.idx = (state.music.idx - 1 + state.tracks.length) % state.tracks.length; musicLoad(); if (state.music.playing) musicPlay(); }
function updatePlayBtn() { $('btn-play').textContent = state.music.playing ? '⏸' : '▶'; }
function toggleMusicBar() { $('music-bar').classList.toggle('music-collapsed'); }

// ===== 我的（管理主页 + 二级页）=====
function renderManageHome() { $('manage-detail').innerHTML = ''; }
function openManage(target) {
  var detail = $('manage-detail'); detail.innerHTML = '';
  var back = el('div', 'detail-back', '‹ 返回'); back.addEventListener('click', renderManageHome); detail.appendChild(back);
  if (target === 'photo') renderPhotoManage(detail);
  else if (target === 'music') renderMusicManage(detail);
  else if (target === 'countdown') renderCountdownManage(detail);
}
function renderPhotoManage(c) {
  c.appendChild(el('div', 'detail-title', '照片管理'));
  var add = el('button', 'add-btn', '＋ 导入照片'); add.addEventListener('click', function () { $('file-photo').click(); }); c.appendChild(add);
  if (state.photos.length === 0) { c.appendChild(el('div', 'empty-hint', '暂无照片')); return; }
  state.photos.forEach(function (p) {
    var item = el('div', 'mg-item'), img = el('img'); img.src = p.url;
    var info = el('div', 'mg-name');
    info.innerHTML = '<div>' + (p.caption || '照片') + '</div><div class="mg-sub">' + ({ MU: '穆', WANG: '橹', CP: 'LM' }[p.category] || 'LM') + (p.favorite ? ' · ❤' : '') + (p.bundled ? ' · 打包' : '') + '</div>';
    if (p.bundled) {
      item.appendChild(img); item.appendChild(info); item.appendChild(el('span', 'mg-sub', '📦'));
    } else {
      var del = el('button', 'mg-del', '🗑️');
      del.addEventListener('click', async function (ev) { ev.stopPropagation(); if (!confirm('删除这张照片？')) return; try { await idbDel('photos', p.id); } catch (e) {} state.photos = state.photos.filter(function (x) { return x.id !== p.id; }); openManage('photo'); });
      item.appendChild(img); item.appendChild(info); item.appendChild(del);
    }
    c.appendChild(item);
  });
}
function renderMusicManage(c) {
  c.appendChild(el('div', 'detail-title', '音乐管理'));
  var add = el('button', 'add-btn', '＋ 导入音乐'); add.addEventListener('click', function () { $('file-music').click(); }); c.appendChild(add);
  if (state.tracks.length === 0) { c.appendChild(el('div', 'empty-hint', '暂无曲目')); return; }
  state.tracks.forEach(function (t) {
    var item = el('div', 'mg-item'), info = el('div', 'mg-name');
    info.innerHTML = '<div>🎵 ' + (t.title || '曲目') + '</div><div class="mg-sub">' + (t.bundled ? '打包' : '用户导入') + '</div>';
    item.appendChild(info);
    if (!t.bundled) {
      var del = el('button', 'mg-del', '🗑️');
      del.addEventListener('click', async function (ev) { ev.stopPropagation(); if (!confirm('删除这首曲目？')) return; try { await idbDel('tracks', t.id); } catch (e) {} state.tracks = state.tracks.filter(function (x) { return x.id !== t.id; }); musicLoad(); openManage('music'); });
      item.appendChild(del);
    }
    c.appendChild(item);
  });
}

// ===== 倒计时（增改删 + 通知）=====
var CD_EMOJIS = ['⏰', '🎂', '💕', '🎉', '🌸', '✨', '🎁', '🎤', '📅', '❤️', '🌙', '🎀'];
var cdSelectedEmoji = '⏰';
function renderCountdownManage(c) {
  c.appendChild(el('div', 'detail-title', '倒计时'));
  var add = el('button', 'add-btn', '＋ 新建倒计时'); add.addEventListener('click', function () { openCdDialog(null); }); c.appendChild(add);
  if (state.countdowns.length === 0) { c.appendChild(el('div', 'empty-hint', '暂无倒计时事件')); return; }
  var now = Date.now();
  state.countdowns.forEach(function (e) {
    var days = Math.floor((e.dateMs - now) / 86400000);
    var remain = days > 0 ? ('还有 ' + days + ' 天') : (days === 0 ? '就是今天' : ('已过 ' + (-days) + ' 天'));
    var card = el('div', 'cd-card'), info = el('div', 'cd-info');
    info.innerHTML = '<div class="cd-t">' + (e.emoji || '⏰') + ' ' + e.title + '</div><div class="cd-d">' + fmtDateTime(e.dateMs) + '</div>';
    var rm = el('div', 'cd-remain', remain), del = el('button', 'cd-del', '🗑️');
    del.addEventListener('click', function (ev) { ev.stopPropagation(); deleteCountdown(e.id); });
    card.addEventListener('click', function () { openCdDialog(e); });
    card.appendChild(info); card.appendChild(rm); card.appendChild(del); c.appendChild(card);
  });
}
function openCdDialog(existing) {
  state.cdEditing = existing;
  $('cd-dialog-title').textContent = existing ? '编辑倒计时' : '新建倒计时';
  $('cd-title').value = existing ? existing.title : '';
  if (existing) { var d = new Date(existing.dateMs); $('cd-datetime').value = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes()); }
  else $('cd-datetime').value = '';
  cdSelectedEmoji = (existing && existing.emoji) || '⏰'; renderEmojiRow();
  $('cd-dialog').classList.remove('hidden');
}
function renderEmojiRow() {
  var row = $('emoji-row'); row.innerHTML = '';
  CD_EMOJIS.forEach(function (e) {
    var b = el('div', 'emoji-pick' + (e === cdSelectedEmoji ? ' sel' : ''), e);
    b.addEventListener('click', function () { cdSelectedEmoji = e; renderEmojiRow(); }); row.appendChild(b);
  });
}
function closeCdDialog() { $('cd-dialog').classList.add('hidden'); }
async function saveCdDialog() {
  var title = $('cd-title').value.trim(), dt = $('cd-datetime').value;
  if (!title) { banner('请填写事件名称'); return; }
  if (!dt) { banner('请选择日期时间'); return; }
  var ms = new Date(dt).getTime();
  if (state.cdEditing) { var e = state.cdEditing; e.title = title; e.dateMs = ms; e.emoji = cdSelectedEmoji; e.notified = false; }
  else state.countdowns.push({ id: uid('cd'), title: title, dateMs: ms, emoji: cdSelectedEmoji, notified: false });
  saveCountdowns(state.countdowns); closeCdDialog(); openManage('countdown');
}
async function deleteCountdown(id) {
  if (!confirm('删除这个倒计时？')) return;
  state.countdowns = state.countdowns.filter(function (e) { return e.id !== id; });
  saveCountdowns(state.countdowns); openManage('countdown');
}

// ===== 通知 =====
async function ensureNotifyPermission() {
  if (!('Notification' in window)) return false;
  if (Notification.permission === 'granted') return true;
  if (Notification.permission !== 'denied') return (await Notification.requestPermission()) === 'granted';
  return false;
}
function checkDueCountdowns() {
  var now = Date.now();
  state.countdowns.forEach(function (e) {
    if (!e.notified && e.dateMs <= now && e.dateMs > now - 60000) { e.notified = true; notifyFire(e); saveCountdowns(state.countdowns); }
  });
}
function notifyFire(e) {
  banner((e.emoji || '⏰') + ' ' + e.title + ' 时间到了！');
  if ('Notification' in window && Notification.permission === 'granted') { try { new Notification((e.emoji || '⏰') + ' ' + e.title, { body: fmtDateTime(e.dateMs) }); } catch (err) {} }
}
function banner(msg) {
  var b = $('notify-banner');
  b.innerHTML = '<span>' + msg + '</span><span class="nb-close">✕</span>';
  b.classList.remove('hidden');
  b.querySelector('.nb-close').addEventListener('click', function () { b.classList.add('hidden'); });
  setTimeout(function () { b.classList.add('hidden'); }, 6000);
}

// ===== 设置 =====
function applySettings() {
  $('set-petals').checked = state.settings.petalsEnabled;
  $('set-interval').value = state.settings.slideshowIntervalSec;
  $('interval-val').textContent = state.settings.slideshowIntervalSec;
  if (state.settings.anniversaryMs > 0) $('set-anniversary').value = fmtDate(state.settings.anniversaryMs);
}
function bindSettings() {
  $('set-petals').addEventListener('change', function () { state.settings.petalsEnabled = this.checked; saveSettings(state.settings); if (state.page === 'slideshow') { if (this.checked) startPetals(); else stopPetals(); } });
  $('set-interval').addEventListener('input', function () { var v = parseInt(this.value, 10); state.settings.slideshowIntervalSec = v; $('interval-val').textContent = v; saveSettings(state.settings); if (state.page === 'slideshow') ensureTimer(); });
  $('set-anniversary').addEventListener('change', function () { state.settings.anniversaryMs = this.value ? new Date(this.value + 'T00:00:00').getTime() : 0; saveSettings(state.settings); if (state.page === 'album') renderAlbum(); });
}

// ===== 文件导入（存 IndexedDB；file:// 下存储不可用则提示）=====
async function importPhotos(files) {
  for (var i = 0; i < files.length; i++) {
    var f = files[i], name = baseName(f.name);
    var photo = { id: uid('photo'), blob: f, url: URL.createObjectURL(f), category: categorizeByName(name), favorite: false, caption: name, bundled: false };
    try { await idbPut('photos', forStore(photo)); } catch (e) { banner('导入失败：浏览器本地存储不可用（file:// 可能受限，建议用 GitHub Pages 或本地服务器）'); return; }
    state.photos.push(photo);
  }
  banner('已导入 ' + files.length + ' 张照片');
  if (state.page === 'album') renderAlbum();
  else if (state.page === 'manage' && $('manage-detail').querySelector('.detail-title') && $('manage-detail').querySelector('.detail-title').textContent === '照片管理') openManage('photo');
}
async function importMusic(files) {
  for (var i = 0; i < files.length; i++) {
    var f = files[i], name = baseName(f.name);
    var track = { id: uid('track'), blob: f, url: URL.createObjectURL(f), title: name, artist: '用户导入', bundled: false };
    try { await idbPut('tracks', forStore(track)); } catch (e) { banner('导入失败：浏览器本地存储不可用（file:// 可能受限，建议用 GitHub Pages 或本地服务器）'); return; }
    state.tracks.push(track);
  }
  banner('已导入 ' + files.length + ' 首音乐');
  musicLoad();
  if (state.page === 'manage' && $('manage-detail').querySelector('.detail-title') && $('manage-detail').querySelector('.detail-title').textContent === '音乐管理') openManage('music');
}

// ===== 事件绑定 =====
function bindEvents() {
  document.querySelectorAll('.tab').forEach(function (t) { t.addEventListener('click', function () { switchPage(t.dataset.page); }); });
  document.querySelectorAll('.chip[data-filter]').forEach(function (c) {
    c.addEventListener('click', function () { state.filter = c.dataset.filter; document.querySelectorAll('.chip[data-filter]').forEach(function (x) { x.classList.toggle('active', x === c); }); renderAlbum(); });
  });
  $('btn-import-photo').addEventListener('click', function () { $('file-photo').click(); });
  $('file-photo').addEventListener('change', function () { if (this.files.length) importPhotos(this.files); this.value = ''; });
  $('file-music').addEventListener('change', function () { if (this.files.length) importMusic(this.files); this.value = ''; });
  $('lightbox-close').addEventListener('click', closeLightbox);
  $('lb-favorite').addEventListener('click', lbToggleFavorite);
  $('lb-category').addEventListener('click', lbCycleCategory);
  $('lb-share').addEventListener('click', lbShare);
  $('lb-delete').addEventListener('click', lbDelete);
  $('lb-slideshow').addEventListener('click', lbToSlideshow);
  var stage = $('lightbox-stage'), sx = 0;
  stage.addEventListener('touchstart', function (e) { sx = e.touches[0].clientX; });
  stage.addEventListener('touchend', function (e) { var ex = e.changedTouches[0].clientX; if (sx - ex > 40) lbNext(1); else if (ex - sx > 40) lbNext(-1); });
  $('btn-play').addEventListener('click', musicToggle);
  $('btn-next').addEventListener('click', musicNext);
  $('btn-prev').addEventListener('click', musicPrev);
  $('slideshow-stage').addEventListener('click', toggleMusicBar);
  $('music-seek').addEventListener('input', function () { var a = state.music.audio; if (a.duration && isFinite(a.duration)) a.currentTime = (this.value / 1000) * a.duration; });
  document.querySelectorAll('.manage-entry').forEach(function (m) { m.addEventListener('click', function () { openManage(m.dataset.target); }); });
  $('cd-cancel').addEventListener('click', closeCdDialog);
  $('cd-save').addEventListener('click', saveCdDialog);
  bindSettings();
  setInterval(checkDueCountdowns, 60000);
}

// ===== 初始化 =====
// 诊断打包资源是否可加载（file:// 下用预览器/内嵌 WebView 会失败，提示用真浏览器）
function diagnoseBundled() {
  var first = state.photos.filter(function (p) { return p.bundled; })[0];
  if (!first) return;
  var img = new Image();
  img.onload = function () {}; // 打包图可加载，正常
  img.onerror = function () {
    banner('打包图片未加载：请用 Safari/Chrome 打开「完整解压文件夹」里的 index.html，或使用网页链接');
  };
  img.src = first.url;
}
async function init() {
  await loadAll(); musicInit(); applySettings(); bindEvents(); switchPage('album'); checkDueCountdowns(); diagnoseBundled();
  if ('Notification' in window && Notification.permission === 'default') setTimeout(function () { ensureNotifyPermission(); }, 3000);
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();

})();
  </script>
</body>
